  flashcards:[
    ["What is the main Philippine mining statute?","RA 7942 — Philippine Mining Act of 1995."],
    ["What law continues to govern small-scale mining under RA 7942 Sec. 42?","RA 7076 — People's Small-Scale Mining Act of 1991."],
    ["Initial Exploration Permit term?","2 years, subject to annual review and relinquishment/renewal."],
    ["Maximum Mineral Agreement term?","25 years, renewable once for another term not exceeding 25 years."],
    ["What does DAO 2000-98 cover?","Mine Safety and Health Standards for exploration, mining, quarrying, mineral processing and allied operations."],
    ["EIA vs ECC?","EIA is an assessment process; ECC is the regulatory decision/commitment document."],
    ["WQG vs GES?","WQG = receiving water; GES = effluent/discharge."],
    ["25–50 persons under RA 4274 Sec. 25?","Registered foreman required."],
    [">50–100 persons under RA 4274 Sec. 25?","One registered mining engineer and one registered foreman."],
    [">75 persons per shift under RA 4274 Sec. 25?","Registered foreman and registered mining engineer for each shift."],
    ["Historical sequence?","CA 137 → PD 463 → 1987 Constitution/EO 279 → RA 7942."],
    ["Which EO strictly prohibits mercury in small-scale mining?","EO 79 (2012)."],
    ["Mineral Agreement area: individual, one province?","10 blocks."],
    ["Mineral Agreement area: entity, one province?","100 blocks."],

    ["Maximum Quarry Permit area and term?","5 hectares; 5 years, renewable for like periods up to 25 years total."],

    ["Who grants a Quarry Permit under RA 7942?","Provincial governor, after compliance and processing through the provincial/city mining regulatory board framework."],
    ["Who grants an Industrial Sand and Gravel Permit under RA 7942?","The Bureau (MGB)."],

  questions:[
    {id:"q1",law:"RA 7942",topic:"Exploration Permit",difficulty:"Easy",q:"Under RA 7942, the initial period of an Exploration Permit is:",choices:["1 year","2 years","5 years","25 years"],answer:1,rationale:"RA 7942 Sec. 21 provides a two-year period, subject to annual review and relinquishment or renewal.",source:"RA 7942 Sec. 21"},
    {id:"q2",law:"RA 7942",topic:"Mineral Agreement",difficulty:"Easy",q:"The maximum initial term of a Mineral Agreement is:",choices:["5 years","10 years","20 years","25 years"],answer:3,rationale:"RA 7942 Sec. 32 allows a term not exceeding 25 years.",source:"RA 7942 Sec. 32"},
    {id:"q3",law:"RA 7942",topic:"Mineral Agreement",difficulty:"Medium",q:"A Mineral Agreement may be renewed for:",choices:["One term not exceeding 25 years","Unlimited 5-year renewals","One 10-year term only","No renewal"],answer:0,rationale:"RA 7942 Sec. 32 provides one renewal term not exceeding 25 years.",source:"RA 7942 Sec. 32"},
    {id:"q4",law:"RA 7942",topic:"Small-scale mining",difficulty:"Easy",q:"RA 7942 Sec. 42 states that small-scale mining shall continue to be governed primarily by:",choices:["RA 6969","RA 7076","RA 8749","RA 9003"],answer:1,rationale:"Sec. 42 expressly refers to RA 7076 and other pertinent laws.",source:"RA 7942 Sec. 42"},
    {id:"q5",law:"EO 79",topic:"Small-scale mining",difficulty:"Medium",q:"Under EO 79, small-scale mining operations shall be undertaken only within:",choices:["Any mineral reservation","Declared Minahang Bayan","Any ancestral domain with barangay permit","Any MPSA area"],answer:1,rationale:"EO 79 Sec. 11 requires SSM operations to be within declared People's Small-Scale Mining Areas or Minahang Bayan.",source:"EO 79 Sec. 11"},
    {id:"q6",law:"EO 79",topic:"Mercury",difficulty:"Easy",q:"EO 79 provides that the use of mercury in small-scale mining shall be:",choices:["Allowed with mayor's permit","Allowed for gold only","Strictly prohibited","Allowed below a daily threshold"],answer:2,rationale:"EO 79 Sec. 11(e) strictly prohibits mercury use in small-scale mining.",source:"EO 79 Sec. 11(e)"},
    {id:"q7",law:"RA 4274",topic:"Personnel",difficulty:"Medium",q:"A mine with 25–50 persons directly engaged in the operation requires at least:",choices:["One registered mining engineer only","One registered foreman","Two mining engineers","No registered personnel"],answer:1,rationale:"RA 4274 Sec. 25(1) requires a registered foreman.",source:"RA 4274 Sec. 25(1)"},
    {id:"q8",law:"RA 4274",topic:"Personnel",difficulty:"Medium",q:"For over 50 but not more than 100 persons directly engaged in mining/quarrying, the required complement is:",choices:["One foreman only","One mining engineer only","One mining engineer and one foreman","Two foremen"],answer:2,rationale:"RA 4274 Sec. 25(2) requires one registered mining engineer and one registered foreman.",source:"RA 4274 Sec. 25(2)"},
    {id:"q9",law:"RA 4274",topic:"Personnel",difficulty:"Hard",q:"For 25–75 persons per shift, RA 4274 requires:",choices:["Engineer per shift only","Foreman per shift and one mining engineer for entire operation","Foreman only for entire operation","Engineer and foreman for every shift"],answer:1,rationale:"Sec. 25(3): one registered foreman per shift and one registered mining engineer for the entire operation.",source:"RA 4274 Sec. 25(3)"},
    {id:"q10",law:"RA 4274",topic:"Personnel",difficulty:"Hard",q:"For more than 75 persons per shift, which is correct?",choices:["Foreman only per shift","Engineer only per shift","Engineer and foreman for each shift","One engineer for entire mine only"],answer:2,rationale:"Sec. 25(4) requires both a registered foreman and registered mining engineer for each shift.",source:"RA 4274 Sec. 25(4)"},
    {id:"q11",law:"PD 1586",topic:"EIA",difficulty:"Medium",q:"Which statement is MOST accurate?",choices:["EIA and ECC are identical","EIA is the assessment process; ECC is a regulatory decision/document","EIS is always a permit","ECC is a mining agreement"],answer:1,rationale:"The PEISS distinguishes the assessment process, study/documentation and ECC decision/conditions.",source:"PD 1586 / PEISS"},
    {id:"q12",law:"RA 9275",topic:"Water",difficulty:"Medium",q:"Which pairing is correct?",choices:["WQG = effluent discharge only","GES = receiving-water class only","WQG = receiving-water criterion; GES = effluent criterion","WQG and GES are always numerically identical"],answer:2,rationale:"WQG addresses receiving-water quality, while GES addresses effluent/discharge.",source:"DAO 2016-08"},
    {id:"q13",law:"DAO 2021-19",topic:"Water",difficulty:"Hard",q:"DAO 2021-19 should be treated as:",choices:["A total repeal of DAO 2016-08","An update to selected water-quality/effluent parameters and provisions","A mine safety code","A quarry-permit rule"],answer:1,rationale:"DAO 2021-19 updates selected parameters/provisions rather than replacing the entire 2016 framework.",source:"DAO 2021-19"},
    {id:"q14",law:"DAO 2000-98",topic:"Safety",difficulty:"Easy",q:"DAO 2000-98 applies to:",choices:["Underground coal mines only","Exploration, mining, quarrying, mineral processing and related operations","Office workplaces only","Only government-owned mines"],answer:1,rationale:"Its scope expressly covers these mining and allied activities.",source:"DAO 2000-98"},
    {id:"q15",law:"RA 8371",topic:"Indigenous Peoples",difficulty:"Medium",q:"Which law is most directly associated with ancestral domain rights and FPIC?",choices:["RA 8371","RA 8749","RA 9275","RA 9003"],answer:0,rationale:"RA 8371 is the Indigenous Peoples' Rights Act.",source:"RA 8371"},
    {id:"q16",law:"RA 11038",topic:"Protected Areas",difficulty:"Medium",q:"RA 11038 is best described as:",choices:["The Clean Water Act","The Expanded NIPAS Act amending RA 7586","The Mining Engineering Law","The Small-Scale Mining Act"],answer:1,rationale:"RA 11038 expands/amends the NIPAS framework under RA 7586.",source:"RA 11038"},
    {id:"q17",law:"RA 6969",topic:"Hazardous Waste",difficulty:"Easy",q:"Which law is the principal statute for toxic substances and hazardous/nuclear wastes?",choices:["RA 6969","RA 9003","RA 8749","RA 7076"],answer:0,rationale:"RA 6969 is the Toxic Substances and Hazardous and Nuclear Wastes Control Act.",source:"RA 6969"},
    {id:"q18",law:"RA 9003",topic:"Solid Waste",difficulty:"Easy",q:"Ecological solid waste management is principally governed by:",choices:["RA 9275","RA 9003","RA 6969","RA 7942"],answer:1,rationale:"RA 9003 is the Ecological Solid Waste Management Act.",source:"RA 9003"},
    {id:"q19",law:"RA 8749",topic:"Air",difficulty:"Medium",q:"A key exam distinction under air-quality regulation is between:",choices:["Ambient air quality and source emission standards","MPSA and FPIC","EIS and Minahang Bayan","Quarry and ancestral domain"],answer:0,rationale:"Ambient standards and source-specific emission standards answer different compliance questions.",source:"RA 8749 / DAO 2000-81"},
    {id:"q20",law:"Historical",topic:"Timeline",difficulty:"Medium",q:"Which sequence best represents the broad historical progression of Philippine mining legislation?",choices:["RA 7942 → CA 137 → PD 463 → EO 279","CA 137 → PD 463 → EO 279/1987 constitutional framework → RA 7942","EO 279 → CA 137 → RA 7076 → PD 463","PD 463 → CA 137 → RA 7942 → EO 279"],answer:1,rationale:"This is the correct broad progression used in the reviewer.",source:"CA 137 / PD 463 / EO 279 / RA 7942"},
    {id:"q21",law:"RA 7942",topic:"Exploration Area",difficulty:"Hard",q:"Under RA 7942 Sec. 22, the maximum onshore EP area in any one province for an individual is:",choices:["10 blocks","20 blocks","40 blocks","100 blocks"],answer:1,rationale:"Sec. 22 provides 20 blocks for individuals in any one province.",source:"RA 7942 Sec. 22"},
    {id:"q22",law:"RA 7942",topic:"Exploration Area",difficulty:"Hard",q:"Under RA 7942 Sec. 22, the maximum onshore EP area in the entire Philippines for a corporation/association is:",choices:["200 blocks","400 blocks","500 blocks","1,000 blocks"],answer:1,rationale:"The statute provides 400 blocks for partnerships, corporations, cooperatives or associations onshore nationwide.",source:"RA 7942 Sec. 22"},
    {id:"q23",law:"RA 7942",topic:"Exploration Area",difficulty:"Hard",q:"For offshore EP areas, the reference in RA 7942 Sec. 22 is beyond:",choices:["100 m from high tide","200 m from shoreline","500 m from mean low tide level","1 km from mean sea level"],answer:2,rationale:"Offshore is described as beyond 500 meters from the mean low tide level.",source:"RA 7942 Sec. 22"},
    {id:"q24",law:"RA 4274",topic:"Practice",difficulty:"Medium",q:"Which activity is within the statutory definition of mining engineering practice under RA 4274?",choices:["Ore reserve calculation","Medical diagnosis","Tax auditing","Architectural design"],answer:0,rationale:"RA 4274 Sec. 12 includes mining reports, valuation and ore reserve calculation among mining engineering services.",source:"RA 4274 Sec. 12"},
    {id:"q25",law:"RA 4274",topic:"Practice",difficulty:"Medium",q:"As a general rule, a person may practice mining engineering in the Philippines only if:",choices:["He has five years mine experience","He is registered under the law or falls within a statutory exemption","He owns a mine","He has an ECC"],answer:1,rationale:"RA 4274 Sec. 11 prohibits practice without prior registration except as provided by statutory exemption.",source:"RA 4274 Sec. 11"},
    {id:"q26",law:"RA 7942",topic:"Mineral Agreement Area",difficulty:"Hard",q:"Maximum onshore Mineral Agreement area in any one province for an individual?",choices:["5 blocks","10 blocks","20 blocks","50 blocks"],answer:1,rationale:"RA 7942 Sec. 28 sets 10 blocks for individuals in any one province.",source:"RA 7942 Sec. 28"},
    {id:"q27",law:"RA 7942",topic:"Mineral Agreement Area",difficulty:"Hard",q:"Maximum onshore Mineral Agreement area in any one province for a corporation/cooperative/association?",choices:["20 blocks","50 blocks","100 blocks","200 blocks"],answer:2,rationale:"RA 7942 Sec. 28 sets 100 blocks for entities in any one province.",source:"RA 7942 Sec. 28"},
    {id:"q28",law:"RA 7942",topic:"FTAA",difficulty:"Hard",q:"Maximum FTAA contract area onshore under RA 7942 Sec. 34?",choices:["500 blocks","1,000 blocks","2,000 blocks","4,000 blocks"],answer:1,rationale:"Sec. 34 provides 1,000 meridional blocks onshore.",source:"RA 7942 Sec. 34"},
    {id:"q29",law:"RA 7942",topic:"FTAA",difficulty:"Hard",q:"Maximum FTAA contract area offshore under RA 7942 Sec. 34?",choices:["500 blocks","1,000 blocks","2,000 blocks","4,000 blocks"],answer:3,rationale:"Sec. 34 provides 4,000 meridional blocks offshore.",source:"RA 7942 Sec. 34"},
    {id:"q30",law:"RA 7942",topic:"Quarry",difficulty:"Medium",q:"Maximum area of a Quarry Permit under RA 7942?",choices:["2 ha","5 ha","10 ha","20 ha"],answer:1,rationale:"Sec. 43 limits a quarry permit to 5 hectares at any one time.",source:"RA 7942 Sec. 43"},
    {id:"q31",law:"RA 7942",topic:"Quarry",difficulty:"Hard",q:"Which correctly states the Quarry Permit term?",choices:["2 years, non-renewable","5 years, renewable for like periods up to 25 years total","10 years + one 10-year renewal","25 years initially"],answer:1,rationale:"Sec. 43 provides a 5-year term, renewable for like periods, total not exceeding 25 years.",source:"RA 7942 Sec. 43"},
    {id:"q32",law:"RA 7942",topic:"Sand and Gravel",difficulty:"Hard",q:"Commercial Sand and Gravel under Sec. 46 is characterized by:",choices:["Mechanical processing and area over 5 ha","Materials used in natural state without processing, area not over 5 ha","Own use only with no commercial disposition","Government infrastructure only"],answer:1,rationale:"Sec. 46 covers loose/unconsolidated materials used in their natural state without undergoing processing, from an area not over 5 hectares.",source:"RA 7942 Sec. 46"},
    {id:"q33",law:"RA 7942",topic:"Sand and Gravel",difficulty:"Hard",q:"Industrial Sand and Gravel Permit is granted by:",choices:["Barangay captain","Provincial governor","The Bureau (MGB)","NCIP"],answer:2,rationale:"RA 7942 Sec. 47 grants this permitting authority to the Bureau.",source:"RA 7942 Sec. 47"},
    {id:"q34",law:"RA 7942",topic:"Sand and Gravel",difficulty:"Hard",q:"Which feature points to an Industrial rather than Commercial Sand and Gravel Permit?",choices:["No processing","Area not over 5 ha","Mechanical processing and area over 5 ha","Own use only"],answer:2,rationale:"Sec. 47 specifically refers to materials necessitating mechanical processing and an area over 5 hectares.",source:"RA 7942 Sec. 47"},
    {id:"q35",law:"RA 7942",topic:"Environmental Protection",difficulty:"Medium",q:"RA 7942 Sec. 69 principally requires contractors to undertake:",choices:["Only an annual tax audit","An environmental protection and enhancement program over the agreement/permit period","Only a wildlife inventory","A barangay development permit"],answer:1,rationale:"Sec. 69 expressly requires an environmental protection and enhancement program incorporated in the work program.",source:"RA 7942 Sec. 69"},
    {id:"q36",law:"RA 7942",topic:"EIA/ECC",difficulty:"Hard",q:"Which statement best reflects RA 7942 Sec. 70?",choices:["ECC is never required for mining","ECC is required based on EIA, subject to the section's specified exploration-period exception","EPEP automatically replaces ECC","Only LGU clearance is needed"],answer:1,rationale:"Sec. 70 requires an ECC based on EIA except during the exploration period specified in the provision.",source:"RA 7942 Sec. 70"},
    {id:"q37",law:"RA 7942",topic:"Fees",difficulty:"Hard",q:"Statutory occupation fee for an Exploration Permit under RA 7942 Sec. 86?",choices:["₱5/ha/year","₱25/ha/year","₱50/ha/year","₱100/ha/year"],answer:0,rationale:"Sec. 86 states ₱5 per hectare or fraction thereof per annum for an exploration permit.",source:"RA 7942 Sec. 86"},
    {id:"q38",law:"RA 7942",topic:"Fees",difficulty:"Hard",q:"Statutory occupation fee for Mineral Agreements and FTAAs under RA 7942 Sec. 86?",choices:["₱5/ha/year","₱25/ha/year","₱50/ha/year","₱100/ha/year"],answer:2,rationale:"Sec. 86 states ₱50 per hectare or fraction thereof per annum.",source:"RA 7942 Sec. 86"},
    {id:"q39",law:"RA 7942",topic:"Mineral Reservation",difficulty:"Hard",q:"Small-scale mining cooperatives may receive preferential right to apply for a small-scale mining agreement covering up to what aggregate portion of a mineral reservation, subject to existing rights?",choices:["10%","20%","25%","50%"],answer:2,rationale:"RA 7942 Sec. 5 provides a maximum aggregate area of 25% of the mineral reservation.",source:"RA 7942 Sec. 5"},
    {id:"q40",law:"PRC Code of Ethics",topic:"Community",difficulty:"Medium",q:"Under the Mining Engineer Code of Ethics, the foremost concern in responsibilities to the community is:",choices:["Maximizing extraction rate","Safety and welfare of the people","Protecting only the client's profit","Avoiding all public communication"],answer:1,rationale:"Article III places awareness of the safety and welfare of the people foremost in professional practice.",source:"PRC Mining Engineer Code of Ethics, Art. III Rule 1"},
    {id:"q41",law:"PRC Code of Ethics",topic:"Professional Opinion",difficulty:"Hard",q:"A mining engineer is asked to sign a strong technical conclusion despite lacking supporting data. Under the Code of Ethics, the best response is to:",choices:["Sign if the client insists","Issue the opinion but omit limitations","Decline to issue the professional opinion without supporting facts and competent analysis","Publish it anonymously"],answer:2,rationale:"Article III requires professional opinions/reports to be supported by facts and competent analysis, with basis and limitations clearly stated.",source:"PRC Mining Engineer Code of Ethics, Art. III"},
    {id:"q42",law:"PRC Code of Ethics",topic:"Conflicts of Interest",difficulty:"Medium",q:"The Code of Ethics provides that a Mining Engineer should:",choices:["Serve parties with directly conflicting interests if both pay","Avoid engaging or offering professional services to those with conflicting and adverse interests","Ignore conflicts if no written contract exists","Only disclose conflicts after project completion"],answer:1,rationale:"Article IV prohibits engaging or offering professional services where conflicting and adverse interests are involved.",source:"PRC Mining Engineer Code of Ethics, Art. IV"},
    {id:"q43",law:"PRC Code of Ethics",topic:"Colleagues",difficulty:"Medium",q:"Which conduct is expressly consistent with the Code of Ethics?",choices:["Plagiarizing a colleague's report","Withholding all credit from subordinates","Acknowledging colleagues' professional work and avoiding plagiarism","Using professional position to oppress competitors"],answer:2,rationale:"Article VI requires acknowledgment of colleagues' work and prohibits plagiarism.",source:"PRC Mining Engineer Code of Ethics, Art. VI"},
    {id:"q44",law:"PRC Code of Ethics",topic:"Government Service",difficulty:"Hard",q:"A Mining Engineer in government service may use the position for private profit when:",choices:["The amount is small","The client is a relative","Never, under the ethical rule stated","Only outside office hours"],answer:2,rationale:"The Code states that a Mining Engineer in government service must work for government interest and shall not employ the position for profit.",source:"PRC Mining Engineer Code of Ethics, Art. II"},
    {id:"q45",law:"RA 7942",topic:"Effectivity",difficulty:"Medium",q:"RA 7942 took effect after:",choices:["Immediately upon signing","15 days after publication","30 days following complete publication in two newspapers of general circulation","90 days after IRR issuance"],answer:2,rationale:"Sec. 116 provides effectivity 30 days following complete publication in two newspapers of general circulation.",source:"RA 7942 Sec. 116"},
    {id:"q46",law:"RA 7942",topic:"Exploration Area",difficulty:"Hard",q:"For an individual, the maximum onshore Exploration Permit area in the entire Philippines is:",choices:["20 blocks","40 blocks","100 blocks","200 blocks"],answer:1,rationale:"RA 7942 Sec. 22 provides 40 blocks for individuals onshore nationwide.",source:"RA 7942 Sec. 22"},
    {id:"q47",law:"RA 7942",topic:"Exploration Area",difficulty:"Hard",q:"For an entity, the maximum offshore Exploration Permit area is:",choices:["200 blocks","400 blocks","500 blocks","1,000 blocks"],answer:3,rationale:"RA 7942 Sec. 22 provides 1,000 blocks offshore for partnerships, corporations, cooperatives or associations.",source:"RA 7942 Sec. 22"},
    {id:"q48",law:"RA 7942",topic:"Mineral Agreement Area",difficulty:"Hard",q:"Maximum onshore Mineral Agreement area nationwide for an individual?",choices:["10 blocks","20 blocks","40 blocks","50 blocks"],answer:1,rationale:"RA 7942 Sec. 28 sets 20 blocks for an individual onshore nationwide.",source:"RA 7942 Sec. 28"},
    {id:"q49",law:"RA 7942",topic:"Mineral Agreement Area",difficulty:"Hard",q:"Maximum offshore Mineral Agreement area for an entity?",choices:["100 blocks","200 blocks","400 blocks","500 blocks"],answer:3,rationale:"RA 7942 Sec. 28 sets 500 blocks offshore for an entity.",source:"RA 7942 Sec. 28"},
    {id:"q50",law:"RA 7942",topic:"Permitting Authority",difficulty:"Medium",q:"Who has statutory authority to grant an Exploration Permit under RA 7942 Sec. 20?",choices:["Provincial governor","Bureau","NCIP","Barangay council"],answer:1,rationale:"Section 20 states that the Bureau has authority to grant an Exploration Permit to a qualified person.",source:"RA 7942 Sec. 20"},
    {id:"q51",law:"RA 7942",topic:"Environmental Protection",difficulty:"Hard",q:"Which item is expressly included in the environmental protection and enhancement program under Sec. 69?",choices:["Only corporate tax planning","Rehabilitation and revegetation","Only exploration drilling","Only legal compliance audits"],answer:1,rationale:"Sec. 69 expressly includes rehabilitation, regeneration, revegetation, reforestation and related environmental measures.",source:"RA 7942 Sec. 69"},
    {id:"q52",law:"RA 7942",topic:"Environmental Protection",difficulty:"Hard",q:"Which is also expressly part of the Sec. 69 environmental program?",choices:["Watershed development and water conservation","Advertising budget","Foreign exchange hedging","Stockholder dividends"],answer:0,rationale:"Sec. 69 includes watershed development and water conservation.",source:"RA 7942 Sec. 69"},
    {id:"q53",law:"RA 7942",topic:"EIA/ECC",difficulty:"Hard",q:"RA 7942 Sec. 70 requires the completed ecological profile of the proposed mining area to form part of the:",choices:["Mineral tax return","Environmental impact assessment","Articles of incorporation","Stock transfer book"],answer:1,rationale:"The section states that a completed ecological profile forms part of the EIA.",source:"RA 7942 Sec. 70"},
    {id:"q54",law:"RA 7942",topic:"EIA/ECC",difficulty:"Hard",q:"Under Sec. 70, NGOs and people's organizations are:",choices:["Barred from environmental monitoring","Allowed and encouraged to participate in ensuring compliance","Authorized to issue ECCs","Automatically parties to all contracts"],answer:1,rationale:"Sec. 70 expressly allows and encourages their participation in ensuring contractors/permittees observe environmental protection requirements.",source:"RA 7942 Sec. 70"},
    {id:"q55",law:"RA 7076",topic:"Small-scale mining",difficulty:"Medium",q:"Which law establishes the People's Small-Scale Mining Program?",choices:["RA 7076","RA 7942","RA 9275","RA 8749"],answer:0,rationale:"RA 7076 is the People's Small-Scale Mining Act of 1991.",source:"RA 7076"},
    {id:"q56",law:"EO 79",topic:"Small-scale mining",difficulty:"Hard",q:"A small-scale gold operation proposes mercury amalgamation. Under EO 79, the correct legal response is:",choices:["Allow if under 5 ha","Allow with governor approval","Prohibit the mercury use","Allow during exploration only"],answer:2,rationale:"EO 79 Sec. 11(e) strictly prohibits use of mercury in small-scale mining.",source:"EO 79 Sec. 11(e)"},
    {id:"q57",law:"RA 8371",topic:"FPIC",difficulty:"Medium",q:"Which concept is most closely associated with RA 8371 in mining-project community compliance?",choices:["FTAA","FPIC","GES","MPSA royalty"],answer:1,rationale:"RA 8371 is the IPRA framework associated with ancestral domains and Free and Prior Informed Consent.",source:"RA 8371"},
    {id:"q58",law:"RA 11038",topic:"Protected Areas",difficulty:"Medium",q:"RA 11038 should be reviewed together with which earlier protected-area statute?",choices:["RA 7586","RA 7076","RA 4274","RA 6969"],answer:0,rationale:"RA 11038 is the Expanded NIPAS Act amending RA 7586.",source:"RA 11038"},
    {id:"q59",law:"RA 9147",topic:"Wildlife",difficulty:"Easy",q:"Which law is principally concerned with wildlife resources and habitat protection?",choices:["RA 9147","RA 9275","RA 9003","RA 8749"],answer:0,rationale:"RA 9147 is the Wildlife Resources Conservation and Protection Act.",source:"RA 9147"},
    {id:"q60",law:"RA 7160",topic:"LGU",difficulty:"Medium",q:"Why is RA 7160 relevant to mining law review?",choices:["It is the Clean Air Act","LGU powers intersect with quarry, permits, local regulation and shares in national wealth","It replaces RA 7942","It is the mining engineering code of ethics"],answer:1,rationale:"The Local Government Code is relevant to local regulatory roles and mineral/quarry-related local powers.",source:"RA 7160"},
    {id:"q61",law:"RA 6969",topic:"Hazardous Waste",difficulty:"Medium",q:"Which should NOT be treated as ordinary ecological solid waste when it is legally classified as hazardous?",choices:["Hazardous process waste","Office paper","Food waste","Clean cardboard"],answer:0,rationale:"Hazardous wastes fall under the RA 6969 hazardous-waste framework, not RA 9003 alone.",source:"RA 6969 / DAO hazardous-waste framework"},
    {id:"q62",law:"RA 9003",topic:"Solid Waste",difficulty:"Medium",q:"Which statement is most accurate?",choices:["RA 9003 governs all hazardous chemical wastes exclusively","RA 9003 is the ecological solid-waste framework and should be distinguished from hazardous-waste regulation","RA 9003 is a mining permit law","RA 9003 creates FTAA"],answer:1,rationale:"RA 9003 addresses ecological solid waste; hazardous wastes require the RA 6969 framework.",source:"RA 9003 / RA 6969"},
    {id:"q63",law:"RA 8749",topic:"Air",difficulty:"Hard",q:"A stack-emission limit from a generator and an ambient-air guideline measured at a receptor are:",choices:["The same regulatory concept","Different regulatory concepts","Both water standards","Both mining agreements"],answer:1,rationale:"Source-emission standards and ambient-air quality guidelines answer different compliance questions.",source:"RA 8749 / DAO 2000-81"},
    {id:"q64",law:"RA 9275",topic:"Water",difficulty:"Hard",q:"A mine asks whether a measured value applies to the river itself or to its discharge pipe. This is primarily a distinction between:",choices:["WQG and GES","MPSA and FTAA","EIS and FPIC","EP and Quarry Permit"],answer:0,rationale:"WQG concerns the receiving water; GES concerns the effluent/discharge.",source:"DAO 2016-08"},
    {id:"q65",law:"DAO 2021-19",topic:"Water",difficulty:"Hard",q:"When studying DAO 2016-08 with DAO 2021-19, the safest review method is to:",choices:["Discard all 2016 values","Assume all 2016 values remain unchanged","Check whether the specific parameter was among the selected updates","Use whichever number is easier to memorize"],answer:2,rationale:"DAO 2021-19 updates selected parameters/provisions rather than the entire framework.",source:"DAO 2021-19"},
    {id:"q66",law:"DAO 2000-98",topic:"Safety",difficulty:"Medium",q:"Which activity falls within the stated scope of DAO 2000-98?",choices:["Mineral processing","Only accounting","Only real estate","Only banking"],answer:0,rationale:"DAO 2000-98 expressly covers exploration, mining, quarrying, mineral processing and allied/related operations.",source:"DAO 2000-98"},
    {id:"q67",law:"DAO 2000-98",topic:"Safety",difficulty:"Medium",q:"One stated objective of DAO 2000-98 is to:",choices:["Promote a culture of safety and health","Eliminate professional registration","Replace environmental laws","Privatize mineral resources"],answer:0,rationale:"The order expressly states promotion of a culture of safety and health among its objectives.",source:"DAO 2000-98"},
    {id:"q68",law:"PRC Code of Ethics",topic:"State",difficulty:"Medium",q:"The Code of Ethics requires the Mining Engineer to conserve and protect natural resources for:",choices:["Private gain alone","The interest of the people","Foreign investors only","No stated public purpose"],answer:1,rationale:"Article II requires faithful professional practice, conservation and protection of natural resources, and development/use for the people's interest.",source:"PRC Mining Engineer Code of Ethics, Art. II"},
    {id:"q69",law:"PRC Code of Ethics",topic:"Employer/Client",difficulty:"Hard",q:"A client instructs a Mining Engineer to promote an interest contrary to law. The Code requires the engineer to:",choices:["Promote it because the client pays","Refuse to advance an interest contrary to law/public policy/professional ethics","Keep silent but continue","Transfer responsibility to a foreman"],answer:1,rationale:"Article IV prohibits advancing a client's or employer's interest contrary to law, public policy or professional obligations and ethics.",source:"PRC Mining Engineer Code of Ethics, Art. IV"},
    {id:"q70",law:"PRC Code of Ethics",topic:"Confidentiality",difficulty:"Hard",q:"Confidential information obtained during employment may be used by the Mining Engineer for personal profit:",choices:["Always","Only after resignation","No, under the Code's confidentiality rule","Only if not written"],answer:2,rationale:"Article IV prohibits divulging confidential information and attempting to profit from it or use it to the employer/client's prejudice.",source:"PRC Mining Engineer Code of Ethics, Art. IV"},
    {id:"q71",law:"PRC Code of Ethics",topic:"Employer/Client",difficulty:"Hard",q:"If a conflict between obligations to a client and professional ethics is beyond reconciliation, the Code indicates the Mining Engineer should:",choices:["Ignore the ethics rule","Sever the professional engagement","Fabricate a compromise","Ask a subordinate to sign"],answer:1,rationale:"Article IV states that where the conflict is beyond reconciliation, the professional engagement should be severed.",source:"PRC Mining Engineer Code of Ethics, Art. IV"},
    {id:"q72",law:"PRC Code of Ethics",topic:"Disclosure",difficulty:"Hard",q:"A Mining Engineer with a personal interest in a mineral property relevant to a prospective client should:",choices:["Conceal it","Disclose the personal interest","Transfer title temporarily","Only disclose after billing"],answer:1,rationale:"The Code requires disclosure of personal interests that may affect relations and obligations to a prospective client/employer.",source:"PRC Mining Engineer Code of Ethics, Art. IV"},
    {id:"q73",law:"PRC Code of Ethics",topic:"Referral",difficulty:"Medium",q:"When a client's interest requires expertise outside the Mining Engineer's competence, the Code supports:",choices:["Pretending competence","Referral to experts or consultants without taking referral favors","Ignoring the issue","Delegating to an unqualified person"],answer:1,rationale:"Article IV directs the Mining Engineer to refer when necessary and not accept favor or compensation for the referral.",source:"PRC Mining Engineer Code of Ethics, Art. IV"},
    {id:"q74",law:"RA 4274",topic:"Personnel",difficulty:"Hard",q:"A mine has 70 persons on each shift. Which complement matches RA 4274 Sec. 25?",choices:["One foreman for entire operation only","One foreman per shift and one mining engineer for the entire operation","Engineer and foreman for each shift","No registered personnel"],answer:1,rationale:"The 25–75 persons-per-shift bracket requires one registered foreman per shift and one registered mining engineer for the entire operation.",source:"RA 4274 Sec. 25(3)"},
    {id:"q75",law:"RA 4274",topic:"Personnel",difficulty:"Hard",q:"A mine has 90 persons on each shift. Which complement matches RA 4274 Sec. 25?",choices:["One engineer for the whole operation only","One foreman only","One registered foreman and one registered mining engineer for each shift","Two foremen for the whole mine"],answer:2,rationale:"More than 75 persons per shift requires both registered roles for each shift.",source:"RA 4274 Sec. 25(4)"},
    {id:"q76",law:"Historical",topic:"Timeline",difficulty:"Hard",q:"Which issuance functioned as a post-1987 constitutional bridge before RA 7942?",choices:["EO 279","RA 9003","DAO 2000-98","RA 9275"],answer:0,rationale:"EO 279 implemented the post-1987 constitutional mining contract framework before RA 7942.",source:"EO 279"},
    {id:"q77",law:"RA 7942",topic:"Quarry",difficulty:"Medium",q:"A quarry applicant proposes a 7-hectare Quarry Permit. Under the statutory maximum in Sec. 43, this area is:",choices:["Within the limit","Above the 5-hectare maximum","Allowed only offshore","Automatically an FTAA"],answer:1,rationale:"The Quarry Permit area may not exceed 5 hectares at any one time.",source:"RA 7942 Sec. 43"},
    {id:"q78",law:"RA 7942",topic:"Sand and Gravel",difficulty:"Hard",q:"Loose sand and gravel used in natural state without processing from 4 hectares is most consistent with:",choices:["Commercial Sand and Gravel Permit","Industrial Sand and Gravel Permit","FTAA","Exploration Permit"],answer:0,rationale:"Sec. 46 describes Commercial S&G as natural-state material without processing from an area not exceeding 5 hectares.",source:"RA 7942 Sec. 46"},
    {id:"q79",law:"RA 7942",topic:"Sand and Gravel",difficulty:"Hard",q:"A 12-hectare sand-and-gravel operation requiring mechanical processing is most consistent with:",choices:["Commercial S&G","Industrial S&G","Exclusive S&G for own use only","Government Gratuitous Permit"],answer:1,rationale:"Sec. 47 covers mechanically processed sand/gravel and an area over 5 hectares.",source:"RA 7942 Sec. 47"},
    {id:"q80",law:"PRC Code of Ethics",topic:"Community",difficulty:"Hard",q:"A Mining Engineer publishes a sensational technical claim that could mislead the public into an unlawful undertaking. Under the Code, this is:",choices:["Acceptable marketing","Prohibited ethical conduct","Required public relations","Allowed if no fee is charged"],answer:1,rationale:"Article III prohibits sensational or exaggerated opinions/reports that may induce immoral, unlawful or welfare-inimical activities.",source:"PRC Mining Engineer Code of Ethics, Art. III"}

  ]
};

</script>
<script>

const $ = s => document.querySelector(s);
const state = JSON.parse(localStorage.getItem("mineleState")||'{"reviewed":[],"bookmarks":[],"mistakes":[],"stats":{"attempted":0,"correct":0},"flash":{}}');
const save=()=>localStorage.setItem("mineleState",JSON.stringify(state));
const pages=[
 ["home","HOME"],["map","LAW MAP"],["review","REVIEW"],["timeline","TIMELINE"],["compare","COMPARE"],
 ["standards","STANDARDS"],["numbers","NUMBERS"],["flashcards","FLASHCARDS"],["quiz","QUIZ"],["mock","MOCK EXAM"],
 ["mistakes","MISTAKES"],["bookmarks","BOOKMARKS"],["sources","SOURCES"]
];
let current="home", flashIndex=0, quizSet=[], quizIndex=0, quizAnswers={}, mockTimer=null;

function yBadge(y){return `<span class="pill y-${y}">${y==="red"?"🔴 VERY HIGH":y==="orange"?"🟠 HIGH":"🟡 SUPPORTING"}</span>`}
function setPage(id){current=id; document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.id===id)); render()}
function nav(){ $("#nav").innerHTML=pages.map(p=>`<button data-id="${p[0]}">${p[1]}</button>`).join(""); document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>setPage(b.dataset.id)); }
function progress(){ let a=state.stats.attempted||0; return a?Math.round((state.stats.correct||0)/a*100):0 }
function home(){
 const weak=state.mistakes.length? "Review Mistake Bank":"No weak topic yet";
 return `<h2>MinELE Laws Dashboard</h2><p class="subtitle">Mining + environmental regulation + professional ethics in one reviewer.</p>
 <div class="grid">
  <div class="card span-3 stat"><strong>${state.reviewed.length}</strong><span>Laws reviewed</span></div>
  <div class="card span-3 stat"><strong>${DB.flashcards.length}</strong><span>Flashcards available</span></div>
  <div class="card span-3 stat"><strong>${progress()}%</strong><span>Quiz accuracy</span></div>
  <div class="card span-3 stat"><strong>${state.mistakes.length}</strong><span>Mistakes saved</span></div>
  <div class="card span-8"><h3>Recommended next topic</h3><p>${weak}</p><div class="row"><button class="btn" onclick="setPage('review')">Continue Review</button><button class="btn alt" onclick="setPage('quiz')">Quick Quiz</button><button class="btn light" onclick="exportProgress()">Export Progress</button><button class="btn light" onclick="importProgress()">Import Progress</button></div></div>
  <div class="card span-4"><h3>Coverage</h3><p><b>${DB.laws.length}</b> core laws/issuances</p><p><b>${DB.questions.length}</b> verified-core questions</p><p><b>${DB.standards.length}</b> standards/parameter records</p></div>
  <div class="card span-12 good"><b>Build rule:</b> current and amended rules are kept distinguishable. The reviewer does not silently replace an older statutory provision with a later administrative update.</div>
 </div>`}
function mapPage(){
 return `<h2>Law Map</h2><p class="subtitle">Tap any branch in Review for detailed notes.</p>
 <div class="grid">
 <div class="card span-4"><h3>Mining framework</h3><p>1987 Constitution</p><p>↓</p><p>CA 137 → PD 463 → EO 279</p><p>↓</p><p><b>RA 7942</b></p><p>↓</p><p>DAO 2010-21 / EO 79</p></div>
 <div class="card span-4"><h3>Environment</h3><p>PD 1586 → PEISS</p><p>RA 9275 → Water</p><p>RA 8749 → Air</p><p>RA 6969 → Hazardous waste/chemicals</p><p>RA 9003 → Solid waste</p><p>RA 11038 / RA 9147 → Protected areas & wildlife</p></div>
 <div class="card span-4"><h3>People + profession</h3><p>RA 8371 → IPRA / FPIC</p><p>RA 7160 → LGU powers</p><p>RA 7076 → Small-scale mining</p><p>RA 4274 → Mining Engineering Law</p></div>
 </div>`}
function review(){
 return `<div class="split"><div><h2>Review</h2><p class="subtitle">Quick + detailed review by law/issuance.</p></div><select id="lawFilter"><option value="">All</option>${[...new Set(DB.laws.map(x=>x.type))].map(x=>`<option>${x}</option>`).join("")}</select></div>
 <div id="lawList" class="law-list">${renderLaws(DB.laws)}</div>`}
function renderLaws(arr){return arr.map(l=>`<div class="card law-item" onclick="openLaw('${l.id}')"><div class="split"><div><div class="tag">${l.type} • ${l.year}</div><h3>${l.number}</h3><p>${l.title}</p></div>${yBadge(l.yield)}</div><p class="muted">${l.summary}</p></div>`).join("")}
window.openLaw=id=>{
 const l=DB.laws.find(x=>x.id===id); if(!l)return;
 if(!state.reviewed.includes(id)){state.reviewed.push(id);save()}
 $("#app").innerHTML=`<button class="btn light" onclick="setPage('review')">← Back</button><div class="card" style="margin-top:12px">
 <div class="split"><div><div class="tag">${l.type} • ${l.year}</div><h2>${l.number}</h2><h3>${l.title}</h3></div>${yBadge(l.yield)}</div>
 <p><b>Status:</b> ${l.status}</p><p>${l.summary}</p>
 <h3>High-yield points</h3><ul>${l.key.map(x=>`<li>${x}</li>`).join("")}</ul>
 ${l.numbers.length?`<h3>Numbers</h3><ul>${l.numbers.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
 <h3>Related</h3><p>${l.related.map(x=>`<span class="pill">${x}</span>`).join("")}</p>
 <div class="row"><button class="btn" onclick="toggleBookmark('${l.id}')">${state.bookmarks.includes(l.id)?"★ Bookmarked":"☆ Bookmark"}</button></div>
 <p class="source">Source: <a href="${l.source}" target="_blank">${l.source}</a></p></div>`}
window.toggleBookmark=id=>{state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];save();openLaw(id)}
function timeline(){return `<h2>Timeline</h2><div class="timeline">${DB.timeline.map(t=>`<div class="card timeline-item"><b>${t[0]} — ${t[1]}</b><p>${t[2]}</p></div>`).join("")}</div>`}
function compare(){return `<h2>Compare Mode</h2>${DB.comparisons.map(c=>`<details open><summary>${c.title}</summary><div class="table-wrap"><table><tbody>${c.rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>`).join("")}`}
function standards(){return `<h2>Standards & Parameters</h2><p class="subtitle">Legal basis + applicability + exam trap.</p><div class="table-wrap"><table><thead><tr><th>Area</th><th>Parameter</th><th>Standard / rule</th><th>Unit</th><th>Basis</th><th>Status</th><th>Trap</th></tr></thead><tbody>${DB.standards.map(s=>`<tr><td>${s.area}</td><td><b>${s.parameter}</b></td><td>${s.standard}</td><td>${s.unit}</td><td>${s.basis}</td><td>${s.status}</td><td>${s.trap}</td></tr>`).join("")}</tbody></table></div>`}
function numbers(){let cats=[...new Set(DB.numbers.map(x=>x.cat))];return `<h2>Numbers You Must Memorize</h2><p class="subtitle">Tap Hide Numbers for active recall.</p><div class="row"><button class="btn" onclick="document.body.classList.toggle('hideNums');document.querySelectorAll('.numv').forEach(e=>e.textContent=e.textContent==='••••'?e.dataset.v:'••••')">Hide / Show Numbers</button></div>${cats.map(c=>`<details open><summary>${c}</summary><div class="table-wrap"><table><tbody>${DB.numbers.filter(n=>n.cat===c).map(n=>`<tr><td class="numv" data-v="${n.value}"><b>${n.value}</b></td><td>${n.meaning}</td><td>${n.law}</td><td>${n.clue}</td></tr>`).join("")}</tbody></table></div></details>`).join("")}`}
function flashcards(){let f=DB.flashcards[flashIndex%DB.flashcards.length];return `<h2>Flashcards</h2><p class="subtitle">Card ${flashIndex+1} of ${DB.flashcards.length}</p><div class="card flash" id="flashCard" onclick="this.classList.toggle('flipped')"><div class="front">${f[0]}</div><div class="back hidden" id="fb">${f[1]}</div></div><div class="row"><button class="btn light" onclick="reveal()">Reveal</button><button class="btn" onclick="rateFlash('know')">Know</button><button class="btn alt" onclick="rateFlash('unsure')">Unsure</button><button class="btn danger" onclick="rateFlash('dont')">Don't Know</button></div>`}
window.reveal=()=>$("#fb").classList.remove("hidden")
window.rateFlash=r=>{state.flash[flashIndex]=r;flashIndex=(flashIndex+1)%DB.flashcards.length;save();render()}
function startQuiz(n=10,onlyMistakes=false,mode="all"){let src=onlyMistakes?DB.questions.filter(q=>state.mistakes.includes(q.id)):DB.questions;
 if(mode==="hard")src=src.filter(q=>q.difficulty==="Hard");
 if(mode==="ethics")src=src.filter(q=>q.law.includes("PRC")||q.law.includes("4274"));
 if(mode==="environment")src=src.filter(q=>["RA 9275","RA 8749","RA 6969","RA 9003","RA 8371","RA 11038","RA 9147","PD 1586","DAO 2021-19"].includes(q.law));
 if(mode==="mining")src=src.filter(q=>q.law==="RA 7942"||q.law==="EO 79"||q.law==="RA 7076"||q.law==="Historical");
 quizSet=[...src].sort(()=>Math.random()-.5).slice(0,Math.min(n,src.length));quizIndex=0;quizAnswers={};renderQuizQ()}
function quiz(){return `<h2>Quiz</h2><p class="subtitle">Explanations appear after each answer.</p>
<div class="row">
<button class="btn" onclick="startQuiz(10)">Quick 10</button><button class="btn" onclick="startQuiz(20)">20 Questions</button><button class="btn" onclick="startQuiz(50)">50 Questions</button>
<button class="btn alt" onclick="startQuiz(50,false,'mining')">Mining Laws</button><button class="btn alt" onclick="startQuiz(50,false,'environment')">Environmental</button>
<button class="btn alt" onclick="startQuiz(50,false,'ethics')">Ethics</button><button class="btn alt" onclick="startQuiz(50,false,'hard')">Hard Mode</button>
<button class="btn danger" onclick="startQuiz(100,true)">Mistakes Only</button>
</div><div class="card" style="margin-top:14px"><p>Verified-core bank: <b>${DB.questions.length}</b> questions</p><p>Accuracy: <b>${progress()}%</b></p></div>`}
window.startQuiz=startQuiz;
function renderQuizQ(){
 if(!quizSet.length){$("#app").innerHTML=quiz();return}
 if(quizIndex>=quizSet.length){let c=Object.values(quizAnswers).filter(x=>x.correct).length;$("#app").innerHTML=`<h2>Quiz Complete</h2><div class="card"><h3>${c}/${quizSet.length}</h3><p>${Math.round(c/quizSet.length*100)}%</p><button class="btn" onclick="setPage('mistakes')">Review mistakes</button></div>`;return}
 let q=quizSet[quizIndex], done=quizAnswers[q.id];
 $("#app").innerHTML=`<div class="split"><h2>Question ${quizIndex+1}/${quizSet.length}</h2><span class="pill">${q.difficulty}</span></div><div class="progress"><span style="width:${(quizIndex/quizSet.length)*100}%"></span></div><div class="card" style="margin-top:14px"><div class="tag">${q.law} • ${q.topic}</div><h3>${q.q}</h3>${q.choices.map((c,i)=>`<button class="choice ${done?(i===q.answer?'correct':i===done.pick?'wrong':''):''}" ${done?'disabled':''} onclick="answerQ(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}${done?`<div class="${done.correct?'good':'trap'}"><b>${done.correct?'Correct':'Incorrect'}</b><p>${q.rationale}</p><small>${q.source}</small></div><button class="btn" onclick="nextQ()">Next</button>`:""}</div>`}
window.answerQ=i=>{let q=quizSet[quizIndex],correct=i===q.answer;quizAnswers[q.id]={pick:i,correct};state.stats.attempted++;if(correct){state.stats.correct++;state.mistakes=state.mistakes.filter(x=>x!==q.id)}else if(!state.mistakes.includes(q.id))state.mistakes.push(q.id);save();renderQuizQ()}
window.nextQ=()=>{quizIndex++;renderQuizQ()}
function mock(){return `<h2>Mock Exam</h2><p class="subtitle">Randomized. No repeated question in one exam. Rationales appear only after submission.</p><div class="row"><button class="btn" onclick="startMock(25)">25</button><button class="btn" onclick="startMock(50)">50</button><button class="btn alt" onclick="startMock(75)">75</button><button class="btn alt" onclick="startMock(100)">100*</button></div><p class="muted">*If the verified bank is smaller than the requested size, all available questions are used.</p>`}
window.startMock=n=>{quizSet=[...DB.questions].sort(()=>Math.random()-.5).slice(0,Math.min(n,DB.questions.length));quizAnswers={};quizIndex=0;mockQ()}
function mockQ(){if(quizIndex>=quizSet.length){let c=Object.values(quizAnswers).filter(x=>x.correct).length;$("#app").innerHTML=`<h2>Mock Result</h2><div class="card"><h3>${c}/${quizSet.length} — ${Math.round(c/quizSet.length*100)}%</h3>${quizSet.filter(q=>!quizAnswers[q.id]?.correct).map(q=>`<details><summary>${q.q}</summary><p>${q.rationale}</p><small>${q.source}</small></details>`).join("")}</div>`;return}let q=quizSet[quizIndex];$("#app").innerHTML=`<h2>Mock ${quizIndex+1}/${quizSet.length}</h2><div class="card"><div class="tag">${q.topic}</div><h3>${q.q}</h3>${q.choices.map((c,i)=>`<button class="choice ${quizAnswers[q.id]?.pick===i?'selected':''}" onclick="mockAns(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}<button class="btn" onclick="mockNext()">Save & Next</button></div>`}
window.mockAns=i=>{let q=quizSet[quizIndex];quizAnswers[q.id]={pick:i,correct:i===q.answer};mockQ()}
window.mockNext=()=>{let q=quizSet[quizIndex];if(!quizAnswers[q.id])return alert("Choose an answer first.");let a=quizAnswers[q.id];state.stats.attempted++;if(a.correct){state.stats.correct++;state.mistakes=state.mistakes.filter(x=>x!==q.id)}else if(!state.mistakes.includes(q.id))state.mistakes.push(q.id);save();quizIndex++;mockQ()}
function mistakes(){let qs=DB.questions.filter(q=>state.mistakes.includes(q.id));return `<div class="split"><div><h2>Mistake Bank</h2><p class="subtitle">${qs.length} saved mistakes</p></div><button class="btn" onclick="startQuiz(50,true)">Retry All</button></div>${qs.length?qs.map(q=>`<div class="card"><b>${q.law} • ${q.topic}</b><p>${q.q}</p><p class="muted">${q.rationale}</p></div>`).join(""):`<div class="card good">No saved mistakes.</div>`}`}
function bookmarks(){let ls=DB.laws.filter(l=>state.bookmarks.includes(l.id));return `<h2>Bookmarks</h2>${ls.length?renderLaws(ls):'<div class="card">No bookmarks yet.</div>'}`}
function sources(){return `<h2>Sources</h2><p class="subtitle">Official/primary-source links used by the seeded reviewer.</p>${DB.laws.map(l=>`<div class="card"><b>${l.number} — ${l.title}</b><p class="source"><a href="${l.source}" target="_blank">${l.source}</a></p></div>`).join("")}`}
function render(){let html={home:home,map:mapPage,review,timeline,compare,standards,numbers,flashcards,quiz,mock,mistakes,bookmarks,sources}[current]();$("#app").innerHTML=html; if(current==="review"){let f=$("#lawFilter");f.onchange=()=>$("#lawList").innerHTML=renderLaws(DB.laws.filter(l=>!f.value||l.type===f.value))}}
function doSearch(q){q=q.trim().toLowerCase();let box=$("#searchResults");if(q.length<2){box.classList.add("hidden");return}let hits=[];DB.laws.forEach(l=>{let s=JSON.stringify(l).toLowerCase();if(s.includes(q))hits.push({t:`${l.number} — ${l.title}`,d:l.summary,a:()=>openLaw(l.id)})});DB.questions.forEach(x=>{if(JSON.stringify(x).toLowerCase().includes(q))hits.push({t:`Question: ${x.topic}`,d:x.q,a:()=>{setPage("quiz")}})});DB.standards.forEach(x=>{if(JSON.stringify(x).toLowerCase().includes(q))hits.push({t:`Standard: ${x.parameter}`,d:`${x.area} • ${x.basis}`,a:()=>setPage("standards")})});box.innerHTML=hits.slice(0,12).map((h,i)=>`<div class="search-hit" data-i="${i}"><b>${h.t}</b><p>${h.d}</p></div>`).join("")||"<div class='search-hit'>No result</div>";box.classList.remove("hidden");box.querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>{box.classList.add("hidden");hits[+el.dataset.i].a()})}
nav();render();
$("#globalSearch").oninput=e=>doSearch(e.target.value);
$("#themeToggle").onclick=()=>{let d=document.documentElement;d.dataset.theme=d.dataset.theme==="dark"?"light":"dark";localStorage.setItem("mineleTheme",d.dataset.theme)}
document.documentElement.dataset.theme=localStorage.getItem("mineleTheme")||"light";

window.exportProgress=()=>{
 const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
 const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="minele-progress.json"; a.click(); URL.revokeObjectURL(a.href);
};
window.importProgress=()=>{
 const i=document.createElement("input"); i.type="file"; i.accept=".json,application/json";
 i.onchange=()=>{const f=i.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{try{const obj=JSON.parse(r.result); localStorage.setItem("mineleState",JSON.stringify(obj)); location.reload()}catch(e){alert("Invalid progress file.")}};r.readAsText(f)};i.click();
};

</script>
</body>
</html>
